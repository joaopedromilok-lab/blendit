# Order the Mode dropdown by family (lit modes, then NPR), matching the interactive
# N-panel. Without this pyRevit lists them alphabetically.
title: Estilo
tooltip: >
  Estilo do render: 16 visuais, do fotorrealista ao croqui e à aquarela.
layout:
  - Realistic          # lit / PBR modes
  - White
  - Shadow
  - Specular
  - "---"
  - Linework           # NPR modes
  - Pen
  - Sketch
  - Cel
  - Hatch
  - Crosshatch
  - Yellowtrace        # the pen-family paper looks
  - BrownPaper
  - Blueprint
  - Diagram            # graphic / print looks
  - Watercolor
  - Risograph
